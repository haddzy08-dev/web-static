<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <!-- untuk memanggil css -->
        <link rel="stylesheet" href="style_8.css" />
    </head>
    <body>
        <header>
            <h1>Website Pendaftaran Mahasiswa</h1>
        </header>
        <nav>
            <ul>
                <li><a href="Pertemuan_8_form.html">Beranda</a></li>
                <li><a href="profil.html">profil</a></li>
                <li><a href="pendaftaran.html">Pendaftaran</a></li>
            </ul>
        </nav>
        <main>
            <section></section>
            <h2>Form Pendaftaran</h2>
            <form action="">
                <!-- type text -->
                <label>Nama: </label>
                <input
                    type="text"
                    name="nama"
                    placeholder="Masukan nama anda"
                    required
                />
                <br />
                <!-- type email -->
                <label>Email: </label>
                <input
                    type="email"
                    name="email"
                    placeholder="Masukan Email anda"
                    required
                />
                <br />
                <!-- password -->
                <label>Password: </label>
                <input
                    type="password"
                    name="pass"
                    placeholder="Masukan password anda"
                    required
                />
                <br />
                <!-- tanggal -->
                <label>Tanggal Lahir: </label>
                <input type="date" name="tanggal lahir" />
                <br />
                <!-- waktu -->
                <label>Waktu Daftar: </label>
                <input type="time" name="waktu" />
                <br />
                <!-- upload -->
                <label>Upload Profile</label>
                <input type="file" name="profil" />
                <br />
                <!-- radio button -->
                <table>
                    Gender:
                </table>
                <input type="radio" name="gender" value="Laki-Laki" />Laki-Laki
                <input type="radio" name="gender" value="Perempuan" />Perempuan
                <br />
                <!-- option drop down -->
                <label>Program Studi: </label>
                <select name="Program Studi" id="">
                    <option value="Sistem_Informasi">Sistem Informasi</option>
                    <option value="Manajemen">Manajemen</option>
                </select>
                <br />
                <!-- check box -->
                <label>Minat: </label>
                <input type="checkbox" name="Minat" value="UI/UX" />UI/UX
                <input type="checkbox" name="Minat" value="Front End" />Front
                End <input type="checkbox" name="Minat" value="Back End" />Back
                End
                <br />
                <!-- Text Area -->
                <label>Alamat: </label>
                <textarea
                    name="Alamat"
                    rows="4"
                    cols="40"
                    placeholder="Masukan Alamat Anda"
                ></textarea>

                <button type="submit">Simpan</button>
                <button type="reset">Reset</button>
            </form>
        </main>
        <footer>
            <p>&copy;2026 Website Pendaftaran.</p>
        </footer>
    </body>
</html>
